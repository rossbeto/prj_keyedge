micronaut:
  application:
    name: issuer
  server:
    port: 15110
    host: ${KEYEDGE_BIND:127.0.0.1}
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    # The working directory may not be readable by the container user (e.g. the host UID for AWS
    # Emulator files): measure the writable tmpfs instead.
    disk-space:
      path: /tmp
# Phase 011: traces off unless the observe profile sets OTEL_TRACES_EXPORTER=otlp (+ endpoint)
otel:
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none
micronaut.metrics:
  enabled: true
  binders:
    web:
      server:
        histogram: true   # http_server_requests_seconds_bucket for per-route p99 panels
  export:
    prometheus:
      enabled: true
      descriptions: true
endpoints.prometheus:
  enabled: true
  sensitive: false
