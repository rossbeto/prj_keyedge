[project]
name = "keyedge-infra"
version = "0.1.0"
description = "keyedge's AWS footprint as a CDK v2 app in Python: the twin of infra/java, proven equal by make cdk-parity (Phase 013, D-45..D-47)"
requires-python = ">=3.14"
# versions in lock-step with gradle/libs.versions.toml (make cdk-versions-check)
dependencies = [
    "aws-cdk-lib==2.278.0",
    "cdk-nag==3.1.0",
    "constructs==10.8.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.14",
    "mypy>=1.18",
    "import-linter>=2.5",
    "jsonschema>=4.25",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keyedge_infra"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101"]   # asserts in tests

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["aws_cdk.*", "cdk_nag.*", "constructs.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "keyedge_infra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers: app -> stacks -> constructs; config independent of constructs/stacks"
type = "layers"
layers = ["keyedge_infra.app", "keyedge_infra.stacks", "keyedge_infra.constructs"]

[[tool.importlinter.contracts]]
name = "config knows no constructs or stacks"
type = "forbidden"
source_modules = ["keyedge_infra.config"]
forbidden_modules = ["keyedge_infra.constructs", "keyedge_infra.stacks", "aws_cdk"]

[[tool.importlinter.contracts]]
name = "constructs read neither config nor stacks"
type = "forbidden"
source_modules = ["keyedge_infra.constructs"]
forbidden_modules = ["keyedge_infra.config", "keyedge_infra.stacks"]
