# Phase 015: virtual threads (structured and future fan-out) vs the Reactor twin, same quotes JVM, same upstreams.
name: vt-vs-reactor
hypothesis: >-
  On the quotes fan-out (3 upstreams, lognormal, pricing median 40 ms / p99 120 ms), the virtual-thread endpoint
  (structured and future adapters) reaches the same saturation rate as the Reactor twin within ±15 %, with p99
  within ±20 % below saturation.
target: edge
path: /v1/quotes/sku-7?qty=2&currency=USD
simScenario: file:bench/sim/lognormal.yaml
rates: [50, 100, 150, 200, 250, 300, 400]
stepSeconds: 20
warmupSeconds: 30
repetitions: 3
# p99 budget: pricing p99 120 ms + fx/stock in parallel + two hops; errors 0.1 %
slo: { p99Ms: 250, maxErrorRatio: 0.001 }
# W ≈ max of three lognormals (~50 ms median, more under load: 60 ms); the edge's gradient cap 500;
# 4 pinned CPUs; ~4 ms CPU per request for JVM edge + quotes (native-vs-jvm: 26.5 CPU-s for 6 000 requests = 4.4 ms)
model: { latencyMs: 60, concurrencyCap: 500, sutCpus: 4, cpuMsPerRequest: 4.4 }
variants:
  - { name: structured, flavor: jvm, env: { KEYEDGE_QUOTES_FANOUT: STRUCTURED } }
  - { name: future, flavor: jvm, env: { KEYEDGE_QUOTES_FANOUT: FUTURE } }
  - { name: reactor, flavor: jvm, env: {}, path: "/v1/quotes-reactive/sku-7?qty=2&currency=USD" }
