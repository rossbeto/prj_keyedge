# Native images + supply chain (Phase 010). Tags and manual runs only: a native build takes ~5 min per
# service and ~5 GB of memory. No signing here until keyless signing has a real CI identity (USER-ACTIONS).
name: native
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1 # one native build at a time (memory)
      matrix:
        service: [edge, quotes, keys]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Native image (GraalVM builder container, pinned by digest)
        run: make native S=${{ matrix.service }}
      - name: JVM image (for the comparison and the SBOM)
        run: ./gradlew :services:${{ matrix.service }}:installDist && docker build -q -f deploy/Dockerfile.jvm --build-arg SERVICE=${{ matrix.service }} -t keyedge/${{ matrix.service }}:dev .
      - name: Size budgets (this service; budgets as in `make image-size`)
        run: |
          make image-size 2>/dev/null | grep "keyedge/${{ matrix.service }}:" | tee budgets.txt
          ! grep -q OVER budgets.txt
      - name: SBOM (classpath + image)
        run: make sbom SUPPLY_IMAGES="keyedge/${{ matrix.service }}:dev keyedge/${{ matrix.service }}:native"
      - name: Trivy (fail on CRITICAL)
        run: make scan SUPPLY_IMAGES="keyedge/${{ matrix.service }}:dev keyedge/${{ matrix.service }}:native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: supply-chain-${{ matrix.service }}
          path: build/supply-chain/
