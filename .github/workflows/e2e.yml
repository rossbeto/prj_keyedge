# The compose stack end to end on both emulators (Phase 016): CDK templates deployed bootstrap-less, services on
# the SSM contract, the demo, quotes-check and the bench harness smoke. Make targets only: local == CI.
# The ECS profile (Docker socket, root-equivalent) is never run here.
name: e2e
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {} # nothing by default; each job asks for what it needs
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stack:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false # a failure on one emulator never hides the other
      matrix:
        target: [floci, aws-emulator]
    env:
      EMULATOR_TELEMETRY: "off"
      BENCH_SUT_CPUS: none # runners have 4 CPUs: no pinning
      BENCH_SUPPORT_CPUS: none
      BENCH_K6_CPUS: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }} # tag runs build clean
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: AWS Emulator image from the latest package (never pinned; the version is in the results)
        if: matrix.target == 'aws-emulator'
        run: docker build --pull --no-cache -t keyedge/aws-emulator:latest deploy/aws-emulator
      - name: Synthesise the CDK templates the stack is deployed from
        run: make cdk-synth CDK_LANG=java
      - name: JVM images
        run: make images
      - name: Stack (emulator, CDK stacks, services)
        env:
          TARGET: ${{ matrix.target }}
        run: make up TARGET="$TARGET"
      - name: Demo, quotes-check, bench harness smoke
        env:
          TARGET: ${{ matrix.target }}
        run: make demo TARGET="$TARGET" && make quotes-check && make bench-smoke TARGET="$TARGET"
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color > compose-logs.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.target }}
          path: |
            results/bench/
            compose-logs.txt
          if-no-files-found: ignore
