# Lint + fast tests (masterplan §11, D-80). Never on push to main: PRs, tags and manual runs only.
name: ci
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Forbidden terms (files, history, every committed revision)
        run: python3 scripts/forbidden_terms.py check --history --all-revisions
      - name: Grafana dashboards are generated (no hand edits)
        run: python3 scripts/build_dashboards.py --check
      - name: Lint (Spotless, Checkstyle, Error Prone/NullAway, ArchUnit)
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest
      - name: Fast tests
        run: ./gradlew test
      - name: Secret scan
        run: scripts/gitleaks.sh
  cdk:
    # CDK app: cdk-nag gate (synth both modes) and the construct/stack/snapshot tests (jsii needs Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: cdk-nag gate (both modes) and CDK tests
        run: make cdk-nag cdk-test
      - name: verify script rejects stubbed resources
        run: scripts/tests/test_cdk_verify.sh
