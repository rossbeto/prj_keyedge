# keyedge local stack. Ports: 127.0.0.1:15xxx only (masterplan §8). The AWS target is one of two
# emulators, chosen by KEYEDGE_AWS_TARGET (profiles `floci` / `aws-emulator`, masterplan §7.2).
name: keyedge

services:
  floci:
    profiles: [floci]
    image: floci/floci:2.5.0@sha256:a0fbf944d7f338cc0856f1ef83831ea749ff2be71956eb7a7fce08fc21458e19
    ports: ["127.0.0.1:15566:4566"]
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: memory
      # Unsupported CloudFormation types must fail, not report CREATE_COMPLETE (D-30, D-42).
      FLOCI_SERVICES_CLOUDFORMATION_ALLOW_STUB_UNSUPPORTED_RESOURCE_TYPES: "false"
    mem_limit: 1g

  # Floci with the Docker socket: ECS tasks run as real sibling containers. Root-equivalent access to
  # the host's Docker daemon, so ONLY in the `ecs` profile, never by default (masterplan §12).
  floci-ecs:
    profiles: [ecs]
    image: floci/floci:2.5.0@sha256:a0fbf944d7f338cc0856f1ef83831ea749ff2be71956eb7a7fce08fc21458e19
    ports: ["127.0.0.1:15567:4566"]
    user: root
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: memory
      FLOCI_SERVICES_CLOUDFORMATION_ALLOW_STUB_UNSUPPORTED_RESOURCE_TYPES: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1g

  aws-emulator:
    profiles: [aws-emulator]
    image: keyedge/aws-emulator:latest
    build: ./aws-emulator
    command: ["-p", "15297"]
    user: "${KEYEDGE_UID:-1000}:${KEYEDGE_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      EMULATOR_TELEMETRY: "off"
    ports: ["127.0.0.1:15297:15297"]
    volumes:
      - ${HOME}/.aws/emulator/15297:/home/emulator/.aws/emulator/15297
    mem_limit: 1g

  # ---- Services (JVM images from deploy/Dockerfile.jvm; make images) -------------------------
  issuer:
    image: keyedge/issuer:dev
    command: ["dev.keyedge.issuer.Application"]
    environment:
      MICRONAUT_SERVER_HOST: 0.0.0.0
    ports: ["127.0.0.1:15110:15110"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/lib/*", "dev.keyedge.ops.HealthProbe", "http://127.0.0.1:15110/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  keys:
    image: keyedge/keys:dev
    command: ["dev.keyedge.keys.Application"]
    # The user's UID: AWS Emulator's per-run files are mode 600 (unused with Floci).
    user: "${KEYEDGE_UID:-65532}:${KEYEDGE_GID:-65532}"
    environment:
      MICRONAUT_SERVER_HOST: 0.0.0.0
      MICRONAUT_ENVIRONMENTS: local
      KEYEDGE_ISSUER_JWKS: http://issuer:15110/.well-known/jwks.json
      KEYEDGE_KEYS_VERIFY_TTL: ${KEYEDGE_VERIFY_TTL:-60s}
      KEYEDGE_AWS_TARGET: ${KEYEDGE_AWS_TARGET:-floci}
      KEYEDGE_AWS_ENDPOINT: ${KEYEDGE_CONTAINER_AWS_ENDPOINT:-http://floci:4566}
      # AWS Emulator's certificate names only localhost/127.0.0.1: connect to the container, verify "localhost".
      KEYEDGE_AWS_CONNECT_HOST: ${KEYEDGE_CONTAINER_CONNECT_HOST:-}
      KEYEDGE_AWS_EMULATOR_DIR: /emulator
    volumes:
      - ${HOME}/.aws/emulator/15297:/emulator:ro
    ports: ["127.0.0.1:15100:15100"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    depends_on:
      issuer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/lib/*", "dev.keyedge.ops.HealthProbe", "http://127.0.0.1:15100/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  upstream-sim:
    image: keyedge/upstream-sim:dev
    command: ["dev.keyedge.sim.Application"]
    environment:
      MICRONAUT_SERVER_HOST: 0.0.0.0
    ports: ["127.0.0.1:15201:15201"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/lib/*", "dev.keyedge.ops.HealthProbe", "http://127.0.0.1:15201/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The sidecar and its app share one network namespace, like two containers in one ECS awsvpc task:
  # quotes listens on 127.0.0.1:15081 and is reachable only through edge (D-29).
  edge:
    image: keyedge/edge:dev
    command: ["dev.keyedge.edge.Application"]
    user: "${KEYEDGE_UID:-65532}:${KEYEDGE_GID:-65532}"
    environment:
      MICRONAUT_SERVER_HOST: 0.0.0.0
      # through Toxiproxy so `make chaos S=keys-down|keys-slow` can break the control plane (Phase 008)
      KEYEDGE_KEYS_URL: ${KEYEDGE_EDGE_KEYS_URL:-http://toxiproxy:15214}
      KEYEDGE_EDGE_RESILIENCE_FAILURE_POLICY: ${KEYEDGE_FAILURE_POLICY:-FAIL_STATIC}
      KEYEDGE_EDGE_CONCURRENCY_MODE: ${KEYEDGE_CONCURRENCY_MODE:-GRADIENT}
      KEYEDGE_APP_URL: http://127.0.0.1:15081
      KEYEDGE_AWS_TARGET: ${KEYEDGE_AWS_TARGET:-floci}
      KEYEDGE_AWS_ENDPOINT: ${KEYEDGE_CONTAINER_AWS_ENDPOINT:-http://floci:4566}
      KEYEDGE_AWS_CONNECT_HOST: ${KEYEDGE_CONTAINER_CONNECT_HOST:-}
      KEYEDGE_AWS_EMULATOR_DIR: /emulator
    volumes:
      - ${HOME}/.aws/emulator/15297:/emulator:ro
    ports: ["127.0.0.1:15080:15080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    stop_grace_period: 30s
    depends_on:
      keys: { condition: service_healthy }
      toxiproxy: { condition: service_started }
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/lib/*", "dev.keyedge.ops.HealthProbe", "http://127.0.0.1:15080/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 30

  quotes:
    image: keyedge/quotes:dev
    command: ["dev.keyedge.quotes.Application"]
    network_mode: "service:edge"
    user: "${KEYEDGE_UID:-65532}:${KEYEDGE_GID:-65532}"
    environment:
      KEYEDGE_AWS_TARGET: ${KEYEDGE_AWS_TARGET:-floci}
      KEYEDGE_AWS_ENDPOINT: ${KEYEDGE_CONTAINER_AWS_ENDPOINT:-http://floci:4566}
      KEYEDGE_AWS_CONNECT_HOST: ${KEYEDGE_CONTAINER_CONNECT_HOST:-}
      KEYEDGE_AWS_EMULATOR_DIR: /emulator
    volumes:
      - ${HOME}/.aws/emulator/15297:/emulator:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    stop_grace_period: 20s
    depends_on:
      edge: { condition: service_started }
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/lib/*", "dev.keyedge.ops.HealthProbe", "http://127.0.0.1:15081/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
    volumes: ["./toxiproxy/proxies.json:/config/proxies.json:ro"]
    ports:
      - "127.0.0.1:15474:8474"
      - "127.0.0.1:15211-15214:15211-15214"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    depends_on:
      upstream-sim: { condition: service_healthy }
      keys: { condition: service_healthy }
