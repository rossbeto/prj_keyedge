# Scrapes every service's /prometheus. Runs in the edge task's network namespace (compose.observe.yaml).
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: edge
    metrics_path: /prometheus
    static_configs: [{ targets: ["127.0.0.1:15080"] }]
  - job_name: quotes
    metrics_path: /prometheus
    static_configs: [{ targets: ["127.0.0.1:15081"] }]
  - job_name: keys
    metrics_path: /prometheus
    static_configs: [{ targets: ["keys:15100"] }]
  - job_name: issuer
    metrics_path: /prometheus
    static_configs: [{ targets: ["issuer:15110"] }]
  - job_name: upstream-sim
    metrics_path: /prometheus
    static_configs: [{ targets: ["upstream-sim:15201"] }]
